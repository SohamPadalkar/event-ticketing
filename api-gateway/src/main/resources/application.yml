server:
  port: 8085

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
          routes:
            - id: event-catalog-route
              uri: lb://EVENT-CATALOG-SERVICE
              predicates:
                - Path=/api/v1/events/**

            - id: booking-service-route
              uri: lb://BOOKING-SERVICE
              predicates:
                - Path=/api/v1/bookings/**

            - id: notification-ticket-route
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/v1/tickets/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
jwt:
  secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
  expiration-ms: 86400000